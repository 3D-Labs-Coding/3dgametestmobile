<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dash Arena Mobile</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#000;
  font-family:Arial;
  touch-action:none;
}

canvas{
  display:block;
}

#hud{
  position:absolute;
  top:10px;
  left:10px;
  color:#fff;
  background:rgba(0,0,0,0.65);
  padding:10px 14px;
  border-radius:10px;
  font-size:14px;
  line-height:1.4;
  z-index:10;
  display:none;
}

.barContainer{
  position:absolute;
  left:10px;
  width:140px;
  height:20px;
  background:#222;
  border:2px solid #555;
  border-radius:4px;
  overflow:hidden;
  font-size:12px;
  color:#fff;
  text-align:center;
  line-height:20px;
  z-index:10;
}

#healthBar{
  width:100%;
  background:red;
  position:absolute;
  top:0;
  left:0;
}

#staminaBar{
  width:100%;
  background:blue;
  position:absolute;
  top:0;
  left:0;
}

#dashCooldown{
  position:absolute;
  bottom:10px;
  left:10px;
  background:rgba(128,128,128,0.8);
  color:#fff;
  padding:4px 8px;
  font-size:12px;
  border-radius:6px;
  z-index:10;
  min-width:32px;
  text-align:center;
}

#startScreen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.95);
  z-index:20;
}

#startScreen h1{
  color:#00ccff;
  font-size:48px;
  margin-bottom:40px;
}

.menuButton{
  background:#222;
  color:#fff;
  border:2px solid #00ccff;
  padding:12px 24px;
  margin:12px;
  font-size:24px;
  cursor:pointer;
  border-radius:8px;
  width:220px;
  text-align:center;
}

#mobileControls{
  position:absolute;
  inset:0;
  z-index:30;
  pointer-events:none;
  display:none;
}

#joystickBase{
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,255,255,0.2);
  bottom:30px;
  left:30px;
  pointer-events:auto;
}

#joystickStick{
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(0,204,255,0.9);
  left:40px;
  top:40px;
}

.mobileBtn{
  position:absolute;
  width:90px;
  height:90px;
  border-radius:50%;
  background:rgba(255,255,255,0.12);
  border:2px solid rgba(255,255,255,0.3);
  color:#fff;
  font-size:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:auto;
  user-select:none;
}

#jumpBtn{
  right:25px;
  bottom:140px;
}

#dashBtn{
  right:140px;
  bottom:40px;
}

@media (max-width:900px){
  #hud{
    font-size:12px;
  }

  .barContainer{
    width:120px;
  }
}
</style>
</head>

<body>

<div id="startScreen">
  <h1>Dash Arena</h1>
  <div class="menuButton" id="playBtn">Play</div>
</div>

<div id="hud">
  Dash Arena Mobile
</div>

<div class="barContainer" style="bottom:70px;">
  <div id="healthBar">100 / 100</div>
</div>

<div class="barContainer" style="bottom:45px;">
  <div id="staminaBar">100 / 100</div>
</div>

<div id="dashCooldown">0.0</div>

<div id="mobileControls">

  <div id="joystickBase">
    <div id="joystickStick"></div>
  </div>

  <div class="mobileBtn" id="jumpBtn">Jump</div>
  <div class="mobileBtn" id="dashBtn">Dash</div>

</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script>
let gameStarted=false;

const playBtn=document.getElementById('playBtn');
const startScreen=document.getElementById('startScreen');
const hud=document.getElementById('hud');

const healthBar=document.getElementById('healthBar');
const staminaBar=document.getElementById('staminaBar');
const dashUI=document.getElementById('dashCooldown');

const mobileControls=document.getElementById('mobileControls');
const joystickBase=document.getElementById('joystickBase');
const joystickStick=document.getElementById('joystickStick');
const jumpBtn=document.getElementById('jumpBtn');
const dashBtn=document.getElementById('dashBtn');

playBtn.addEventListener('click',()=>{
  gameStarted=true;
  startScreen.style.display='none';
  hud.style.display='block';
  mobileControls.style.display='block';
});

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2b2b2b);

const camera=new THREE.PerspectiveCamera(
  75,
  window.innerWidth/window.innerHeight,
  0.1,
  500
);

const renderer=new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:'high-performance'
});

renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1));

const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(300,300),
  new THREE.MeshBasicMaterial({color:0x4c4c4c})
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);

const walls=[];

function createWall(x){
  const wall=new THREE.Mesh(
    new THREE.BoxGeometry(1,6,80),
    new THREE.MeshBasicMaterial({color:0x8a8a8a})
  );

  wall.position.set(x,3,0);

  scene.add(wall);

  walls.push(wall);
}

createWall(-12);
createWall(12);

const player=new THREE.Object3D();
player.position.set(0,0.8,0);
scene.add(player);

const body=new THREE.Group();

const material=new THREE.MeshBasicMaterial({
  color:0x00ccff
});

const torso=new THREE.Mesh(
  new THREE.CylinderGeometry(0.5,0.5,1,16),
  material
);

torso.position.y=0.8;

const head=new THREE.Mesh(
  new THREE.SphereGeometry(0.5,16,16),
  material
);

head.position.y=1.7;

const feet=new THREE.Mesh(
  new THREE.SphereGeometry(0.5,16,16),
  material
);

feet.position.y=0.2;

body.add(torso);
body.add(head);
body.add(feet);

player.add(body);

let health=100;
let stamina=100;

const maxHealth=100;
const maxStamina=100;

let yaw=0;
let pitch=0;

let vx=0;
let vy=0;
let vz=0;

const gravity=-0.03;

const walkAccel=0.045;
const sprintAccel=0.075;

const maxSpeed=0.55;
const HARD_SPEED_LIMIT=0.7;

let grounded=true;

let dashCooldownFrames=0;

let wallLockTimer=0;

const keys={};

window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
});

window.addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()]=false;
});

let joyX=0;
let joyY=0;
let joystickActive=false;

function updateJoystick(x,y){

  const rect=joystickBase.getBoundingClientRect();

  const centerX=rect.left+rect.width/2;
  const centerY=rect.top+rect.height/2;

  let dx=x-centerX;
  let dy=y-centerY;

  const dist=Math.hypot(dx,dy);

  const maxDist=45;

  if(dist>maxDist){
    dx=dx/dist*maxDist;
    dy=dy/dist*maxDist;
  }

  joystickStick.style.transform=
  `translate(${dx}px,${dy}px)`;

  joyX=dx/maxDist;
  joyY=dy/maxDist;
}

function resetJoystick(){
  joyX=0;
  joyY=0;

  joystickStick.style.transform=
  'translate(0px,0px)';
}

joystickBase.addEventListener('touchstart',()=>{
  joystickActive=true;
});

joystickBase.addEventListener('touchmove',e=>{

  if(!joystickActive) return;

  const touch=e.touches[0];

  updateJoystick(
    touch.clientX,
    touch.clientY
  );

});

joystickBase.addEventListener('touchend',()=>{

  joystickActive=false;

  resetJoystick();

});

jumpBtn.addEventListener('touchstart',()=>{
  keys[' ']=true;
});

jumpBtn.addEventListener('touchend',()=>{
  keys[' ']=false;
});

dashBtn.addEventListener('touchstart',()=>{
  keys['control']=true;
});

dashBtn.addEventListener('touchend',()=>{
  keys['control']=false;
});

let lastTouchX=0;
let lastTouchY=0;

document.addEventListener('touchstart',e=>{

  const touch=e.touches[0];

  lastTouchX=touch.clientX;
  lastTouchY=touch.clientY;

},{passive:false});

document.addEventListener('touchmove',e=>{

  const touch=e.touches[0];

  if(touch.clientX<window.innerWidth*0.45) return;

  const dx=touch.clientX-lastTouchX;
  const dy=touch.clientY-lastTouchY;

  yaw-=dx*0.005;
  pitch-=dy*0.005;

  pitch=Math.max(
    -1.15,
    Math.min(1.15,pitch)
  );

  lastTouchX=touch.clientX;
  lastTouchY=touch.clientY;

},{passive:false});

function updateMovement(){

  player.rotation.y=yaw;

  const sin=Math.sin(yaw);
  const cos=Math.cos(yaw);

  const forwardX=-sin;
  const forwardZ=-cos;

  const rightX=cos;
  const rightZ=-sin;

  const accel=walkAccel;

  if(joyY<-0.15){
    vx+=forwardX*accel*(-joyY);
    vz+=forwardZ*accel*(-joyY);
  }

  if(joyY>0.15){
    vx-=forwardX*accel*(joyY);
    vz-=forwardZ*accel*(joyY);
  }

  if(joyX<-0.15){
    vx-=rightX*accel*(-joyX);
    vz-=rightZ*accel*(-joyX);
  }

  if(joyX>0.15){
    vx+=rightX*accel*(joyX);
    vz+=rightZ*accel*(joyX);
  }

  if(keys['control'] && dashCooldownFrames<=0 && wallLockTimer===0){

    vx+=forwardX*0.6;
    vz+=forwardZ*0.6;

    dashCooldownFrames=90;
  }

  if(dashCooldownFrames>0){
    dashCooldownFrames--;
  }

  if(keys[' '] && grounded){

    vy=0.6;

    grounded=false;
  }

  vy+=gravity;

  vx=Math.max(
    -maxSpeed,
    Math.min(maxSpeed,vx)
  );

  vz=Math.max(
    -maxSpeed,
    Math.min(maxSpeed,vz)
  );

  vx*=grounded?0.82:0.94;
  vz*=grounded?0.82:0.94;

  player.position.x+=vx;
  player.position.y+=vy;
  player.position.z+=vz;

  grounded=false;

  if(player.position.y<=0.8){

    player.position.y=0.8;

    vy=0;

    grounded=true;
  }

  let touchingWall=false;

  walls.forEach(w=>{

    const dx=player.position.x-w.position.x;

    if(Math.abs(dx)<1){

      touchingWall=true;

      wallLockTimer=6;

      player.position.x=
      dx<0
      ? w.position.x-1
      : w.position.x+1;

      vx=0;
    }

  });

  if(!grounded && touchingWall && vy<0){
    vy=0;
  }

  if(!grounded && touchingWall && keys[' ']){

    vy=0.55;

    vx+=Math.sign(vx||1)*0.6;
  }

  if(wallLockTimer>0){
    wallLockTimer--;
  }

  vx=Math.max(
    -HARD_SPEED_LIMIT,
    Math.min(HARD_SPEED_LIMIT,vx)
  );

  vz=Math.max(
    -HARD_SPEED_LIMIT,
    Math.min(HARD_SPEED_LIMIT,vz)
  );

  if(
    Math.abs(joyX)>0.15 ||
    Math.abs(joyY)>0.15
  ){
    stamina=Math.max(
      0,
      stamina-0.05
    );
  }else{
    stamina=Math.min(
      maxStamina,
      stamina+0.1
    );
  }

}

function updateCamera(){

  camera.rotation.order='YXZ';

  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  camera.position.set(
    player.position.x,
    player.position.y+1.2,
    player.position.z
  );

  body.visible=false;

}

function animate(){

  requestAnimationFrame(animate);

  if(!gameStarted) return;

  updateMovement();

  updateCamera();

  renderer.render(scene,camera);

  dashUI.textContent=
  (dashCooldownFrames/60).toFixed(1);

  healthBar.style.width=
  (health/maxHealth*100)+'%';

  healthBar.textContent=
  Math.round(health)+' / '+maxHealth;

  staminaBar.style.width=
  (stamina/maxStamina*100)+'%';

  staminaBar.textContent=
  Math.round(stamina)+' / '+maxStamina;

}

window.addEventListener('resize',()=>{

  camera.aspect=
  window.innerWidth/window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

animate();
</script>
</body>
</html>
